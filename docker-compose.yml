services:
  mongodb:
    image: mongo:8.0
    container_name: football_bot_mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  bot_app:
    build: .
    container_name: football_bot_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - MONGO_DB_NAME=football_bot
    depends_on:
      - mongodb

volumes:
  mongodb_data:
