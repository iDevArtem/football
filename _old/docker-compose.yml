services:
  mongodb:
    image: mongo:8.0
    container_name: football_bot_mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  bot:
    build: .
    container_name: football_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mongodb

volumes:
  mongodb_data:
