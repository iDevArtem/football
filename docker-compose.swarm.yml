services:
  app:
    image: football-bot:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB_NAME=${MONGO_DB_NAME:-football_bot}
      - WEBAPP_URL=${WEBAPP_URL:-https://football.idev.wtf}
    stop_grace_period: 15s
    networks:
      - traefik-public
      - football-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.football-app.rule=Host(`football.idev.wtf`)"
        - "traefik.http.routers.football-app.entrypoints=websecure"
        - "traefik.http.routers.football-app.tls=true"
        - "traefik.http.routers.football-app.tls.certresolver=letsencrypt"

        - "traefik.http.services.football-app.loadbalancer.server.port=8000"

  mongo:
    image: mongo:8.0
    networks:
      - football-internal
    volumes:
      - football-mongo-data:/data/db
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  traefik-public:
    external: true
  football-internal:
    driver: overlay
    attachable: true

volumes:
  football-mongo-data:
