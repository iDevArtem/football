services:
  app:
    image: football-bot:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB_NAME=${MONGO_DB_NAME:-football_bot}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
      - WEBAPP_URL=https://football.idev.wtf
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-change-me-in-production}
      - CARD_NUMBER=${CARD_NUMBER:-}
      - CARD_RECIPIENT=${CARD_RECIPIENT:-}
    networks:
      - traefik-public
      - football-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.football-app.rule=Host(`football.idev.wtf`)"
        - "traefik.http.routers.football-app.entrypoints=websecure"
        - "traefik.http.routers.football-app.tls=true"
        - "traefik.http.routers.football-app.tls.certresolver=letsencrypt"

        # Cloudflare IP Whitelist Middleware
        - "traefik.http.middlewares.football-cloudflare-only.ipwhitelist.sourcerange=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
        - "traefik.http.routers.football-app.middlewares=football-cloudflare-only"

        - "traefik.http.services.football-app.loadbalancer.server.port=8000"

  mongo:
    image: mongo:8.0
    networks:
      - football-internal
    volumes:
      - football-mongo-data:/data/db
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  traefik-public:
    external: true
  football-internal:
    driver: overlay
    attachable: true

volumes:
  football-mongo-data:
